name = "user-api"
main = "src/index.js"
compatibility_date = "2025-06-17"
 
# 重试配置（当请求失败时的重试策略）
[retry]
max_retries = 3
min_delay = 100 # 毫秒
jitter = true # 添加随机抖动，避免所有重试同时发生

# 环境变量配置
[vars]
API_VERSION = "1.0.0"
# 原 Cloudflare Workers 备份地址
# BACKUP_API_URL = "https://backup-api.532736720.workers.dev"
# 新的自定义域名备份 API 地址
BACKUP_API_URL = "https://backup-api.9696mm.club"
CORS_ORIGINS = "https://9696mm.club,https://mapconnect.pages.dev"

# 数据库绑定配置
[[d1_databases]]
binding = "DB"
database_name = "users-db"
database_id = "a42334b8-9c7a-4b71-aa32-9e99aeefe290" 